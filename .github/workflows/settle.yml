# pays out and refunds due pots every 10 minutes, for pots nobody happens to open. a run fails (and github
# emails about it) when a site reports a failed payout or refund, unread pots, or a relayer low on gas.
# repository secrets, one pair per site, since each vercel project has its own CRON_SECRET:
#   APP_URL               the mainnet site, https://pottle.xyz
#   CRON_SECRET           CRON_SECRET of the mainnet vercel project
#   APP_URL_TESTNET       the testnet site, https://test.pottle.xyz
#   CRON_SECRET_TESTNET   CRON_SECRET of the testnet vercel project
name: settle pots
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
# it only calls the two sites over https, so it needs no access to the repo at all
permissions: {}
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: settle due pots on each site
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL_TESTNET: ${{ secrets.APP_URL_TESTNET }}
          CRON_SECRET_TESTNET: ${{ secrets.CRON_SECRET_TESTNET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then echo "CRON_SECRET or APP_URL secret missing"; exit 1; fi
          failed=0
          settle() {
            [ -z "$1" ] && return 0
            if [ -z "$2" ]; then echo "== $1: no secret for this site"; failed=1; return 0; fi
            echo "== $1"
            curl -sS --fail-with-body -m 90 -H "authorization: Bearer $2" "$1/api/cron/settle" || failed=1
            echo
          }
          settle "$APP_URL" "$CRON_SECRET"
          settle "$APP_URL_TESTNET" "$CRON_SECRET_TESTNET"
          exit $failed
