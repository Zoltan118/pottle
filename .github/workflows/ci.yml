# every push and pull request: the contract's tests (unit, fuzz, invariant) and the app's lint,
# types and production build. the README's tests badge is this workflow
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - name: build
        run: forge build --sizes
      - name: test (unit, fuzz, invariant)
        run: forge test -vv
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # npm install, not npm ci: a lock written on a mac leaves out linux-only optional packages
      # (npm/cli#4828) and npm ci refuses it. vercel builds the site the same way
      - run: npm install --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: types
        run: npx tsc --noEmit
      - name: production build
        # no settings: the app builds without any, and says what is missing at runtime
        run: npm run build
